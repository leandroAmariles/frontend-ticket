     <div class="tickets-table-wrapper" [attr.data-testid]="dataTestId">
  <!-- Loading state -->
  <app-loading-skeleton *ngIf="isLoading"></app-loading-skeleton>

  <!-- Empty state -->
  <app-empty-state *ngIf="!isLoading && (!tickets || tickets.length === 0)"></app-empty-state>

  <table *ngIf="!isLoading && tickets && tickets.length > 0" mat-table [dataSource]="tickets" class="tickets-table" role="table" aria-label="Tickets table">
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef ID="col-id" scope="col">ID</th>
      <td mat-cell *matCellDef="let ticket" class="id-cell">
        {{ ticket.id | slice : 0 : 8 }}
      </td>
    </ng-container>

    <!-- Titulo Column -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef ID="col-titulo" scope="col">Título</th>
      <td mat-cell *matCellDef="let ticket" class="titulo-cell" [title]="ticket.titulo">
        {{ truncateTitle(ticket.titulo) }}
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef ID="col-status" scope="col">Estado</th>
      <td mat-cell *matCellDef="let ticket" class="status-cell">
        <span [class]="'status-' + ticket.status">
          {{ getStatusLabel(ticket.status) }}
        </span>
      </td>
    </ng-container>

    <!-- Creator ID Column -->
    <ng-container matColumnDef="creatorId">
      <th mat-header-cell *matHeaderCellDef ID="col-creator" scope="col">Creador</th>
      <td mat-cell *matCellDef="let ticket" class="creator-cell">
        {{ ticket.creatorId | slice : 0 : 8 }}
      </td>
    </ng-container>

    <!-- Created At Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef ID="col-created" scope="col">Creado</th>
      <td mat-cell *matCellDef="let ticket" class="created-at-cell">
        {{ formatDate(ticket.createdAt) }}
      </td>
    </ng-container>

    <!-- Header and Row definitions -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let ticket; columns: displayedColumns; trackBy: trackByTicketId" tabindex="0"></tr>
  </table>

  <!-- Paginator -->
  <mat-paginator
    *ngIf="pagination"
    [length]="pagination.total"
    [pageSize]="pagination.size"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageEvent($event)"
    aria-label="Select page"
    data-testid="paginator"
  ></mat-paginator>
</div>
