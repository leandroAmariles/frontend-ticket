<div class="tickets-table-wrapper" [attr.data-testid]="dataTestId">
  <!-- Reload loading indicator (shown above existing data) -->
  <div *ngIf="isLoading" class="reload-loading" role="status" aria-live="polite">
    <mat-progress-bar mode="indeterminate" aria-label="Loading tickets..."></mat-progress-bar>
  </div>

  <!-- Empty state -->
  <app-empty-state
    *ngIf="!isLoading && (!tickets || tickets.length === 0)"
    (createTicket)="createTicket.emit()"
  ></app-empty-state>

  <table
    *ngIf="tickets && tickets.length > 0"
    mat-table
    matSort
    [matSortActive]="currentSort.active"
    [matSortDirection]="currentSort.direction"
    (matSortChange)="onSortChange($event)"
    [dataSource]="sortedTickets"
    [trackBy]="trackByTicketId"
    class="tickets-table"
    [class.table-loading]="isLoading"
    role="table"
    aria-label="Tickets table"
  >
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef id="col-id" scope="col">ID</th>
      <td mat-cell *matCellDef="let ticket" class="id-cell">
        {{ ticket.id | slice : 0 : 8 }}
      </td>
    </ng-container>

    <!-- Titulo Column -->
    <ng-container matColumnDef="titulo">
      <th mat-header-cell *matHeaderCellDef id="col-titulo" scope="col">Título</th>
      <td mat-cell *matCellDef="let ticket" class="titulo-cell" [title]="ticket.titulo">
        {{ truncateTitle(ticket.titulo) }}
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef id="col-status" scope="col">Estado</th>
      <td mat-cell *matCellDef="let ticket" class="status-cell">
        <span [class]="'status-' + ticket.status">
          {{ getStatusLabel(ticket.status) }}
        </span>
      </td>
    </ng-container>

    <!-- Tipo Column -->
    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef id="col-type" scope="col">Tipo</th>
      <td mat-cell *matCellDef="let ticket" class="type-cell">
        <span *ngIf="ticket.ticketType; else noType" [ngClass]="getTypeCssClass(ticket.ticketType)">
          {{ getTypeLabel(ticket.ticketType) }}
        </span>
        <ng-template #noType><span class="type-none">—</span></ng-template>
      </td>
    </ng-container>

    <!-- Severity Column -->
    <ng-container matColumnDef="severity">
      <th mat-header-cell *matHeaderCellDef mat-sort-header="severity" id="col-severity" scope="col">Prioridad</th>
      <td mat-cell *matCellDef="let ticket" class="severity-cell">
        <span *ngIf="ticket.severity; else noSeverity" [ngClass]="getSeverityCssClass(ticket.severity)">
          {{ getSeverityLabel(ticket.severity) }}
        </span>
        <ng-template #noSeverity><span class="severity-none">—</span></ng-template>
      </td>
    </ng-container>

    <!-- Created At Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef id="col-created" scope="col">Creado</th>
      <td mat-cell *matCellDef="let ticket" class="created-at-cell">
        {{ formatDate(ticket.createdAt) }}
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let ticket; columns: displayedColumns;"></tr>
  </table>

  <!-- Paginator keeps pageIndex and pageSize in sync with server state -->
  <mat-paginator
    *ngIf="pagination"
    [length]="pagination.total"
    [pageSize]="currentPageSize"
    [pageIndex]="pagination.page"
    [pageSizeOptions]="pageSizeOptions"
    [disabled]="isLoading"
    (page)="onPageEvent($event)"
    aria-label="Seleccionar página"
    data-testid="paginator"
  ></mat-paginator>
</div>
