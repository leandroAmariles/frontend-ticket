<div class="tickets-table-wrapper" data-testid="tickets-table">
  <table mat-table [dataSource]="tickets" matSort (matSortChange)="onSortChange($event)" class="tickets-table">
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let ticket" class="id-cell">
        {{ ticket.id | slice : 0 : 8 }}
      </td>
    </ng-container>

    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
      <td mat-cell *matCellDef="let ticket" class="title-cell" [title]="getFullTitle(ticket.title)">
        {{ truncateTitle(ticket.title) }}
      </td>
    </ng-container>

    <!-- Priority Column -->
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Priority</th>
      <td mat-cell *matCellDef="let ticket" class="priority-cell">
        <span [class]="'priority-' + ticket.priority">
          {{ getPriorityLabel(ticket.priority) }}
        </span>
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let ticket" class="status-cell">
        <span [class]="'status-' + ticket.status">
          {{ getStatusLabel(ticket.status) }}
        </span>
      </td>
    </ng-container>

    <!-- Assigned To Column -->
    <ng-container matColumnDef="assignedTo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Assigned To</th>
      <td mat-cell *matCellDef="let ticket" class="assigned-to-cell">
        {{ getAssignedName(ticket) }}
      </td>
    </ng-container>

    <!-- Created At Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Created At</th>
      <td mat-cell *matCellDef="let ticket" class="created-at-cell">
        {{ formatDate(ticket.created_at) }}
      </td>
    </ng-container>

    <!-- Header and Row definitions -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let ticket; columns: displayedColumns; trackBy: trackByTicketId"></tr>
  </table>

  <!-- Paginator -->
  <mat-paginator
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageEvent($event)"
    aria-label="Select page"
    data-testid="paginator"
  ></mat-paginator>
</div>
