<div class="tickets-table-wrapper" data-testid="tickets-table">
  <!-- Loading state -->
  <app-loading-skeleton *ngIf="isLoading"></app-loading-skeleton>

  <!-- Empty state -->
  <app-empty-state *ngIf="!isLoading && (!tickets || tickets.length === 0)"></app-empty-state>

  <table *ngIf="!isLoading && tickets && tickets.length > 0" mat-table [dataSource]="tickets" matSort (matSortChange)="onSortChange($event)" class="tickets-table" role="table" aria-label="Tickets table">
    <!-- ID Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header ID="col-id" scope="col">ID</th>
      <td mat-cell *matCellDef="let ticket" class="id-cell">
        {{ ticket.id | slice : 0 : 8 }}
      </td>
    </ng-container>

    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header ID="col-title" scope="col">Title</th>
      <td mat-cell *matCellDef="let ticket" class="title-cell" [title]="getFullTitle(ticket.title)">
        {{ truncateTitle(ticket.title) }}
      </td>
    </ng-container>

    <!-- Priority Column -->
    <ng-container matColumnDef="priority">
      <th mat-header-cell *matHeaderCellDef mat-sort-header ID="col-priority" scope="col">Priority</th>
      <td mat-cell *matCellDef="let ticket" class="priority-cell">
        <span [class]="'priority-' + ticket.priority">
          {{ getPriorityLabel(ticket.priority) }}
        </span>
      </td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef mat-sort-header ID="col-status" scope="col">Status</th>
      <td mat-cell *matCellDef="let ticket" class="status-cell">
        <span [class]="'status-' + ticket.status">
          {{ getStatusLabel(ticket.status) }}
        </span>
      </td>
    </ng-container>

    <!-- Assigned To Column -->
    <ng-container matColumnDef="assignedTo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header ID="col-assigned" scope="col">Assigned To</th>
      <td mat-cell *matCellDef="let ticket" class="assigned-to-cell">
        {{ getAssignedName(ticket) }}
      </td>
    </ng-container>

    <!-- Created At Column -->
    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header ID="col-created" scope="col">Created At</th>
      <td mat-cell *matCellDef="let ticket" class="created-at-cell">
        {{ formatDate(ticket.created_at) }}
      </td>
    </ng-container>

    <!-- Header and Row definitions -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let ticket; columns: displayedColumns; trackBy: trackByTicketId" tabindex="0"></tr>
  </table>

  <!-- Paginator -->
  <mat-paginator
    [length]="totalItems"
    [pageSize]="pageSize"
    [pageSizeOptions]="pageSizeOptions"
    (page)="onPageEvent($event)"
    aria-label="Select page"
    data-testid="paginator"
  ></mat-paginator>
</div>
