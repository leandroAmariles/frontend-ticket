<div class="tickets-list-page" role="main" aria-label="Tickets dashboard">
  <!-- Header with title and CTA -->
  <div class="page-header">
    <h1>Support Tickets</h1>
    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()"
      data-testid="btn-new-ticket"
      class="btn-new-ticket"
      aria-label="Create a new support ticket"
      title="Create a new support ticket"
    >
      + New Ticket
    </button>
  </div>

  <app-ticket-stats-cards></app-ticket-stats-cards>

  <!-- Error state with retry button -->
  <div *ngIf="error$ | async as error" class="error-section" role="alert" aria-live="polite" aria-atomic="true">
    <mat-card class="error-message">
      <mat-card-content>
        <mat-icon class="error-icon" aria-hidden="true">error_outline</mat-icon>
        <p class="error-text">{{ error }}</p>
        <button
          mat-raised-button
          color="accent"
          (click)="onRetry()"
          data-testid="btn-retry"
          aria-label="Retry loading tickets"
          title="Retry loading tickets"
        >
          ⟳ Retry
        </button>
      </mat-card-content>
    </mat-card>
  </div>

  <!--
    Table container: always rendered once there is no error.
    The loading spinner is shown INSIDE the tickets-table component
    so the paginator is never destroyed between pagination requests.
  -->
  <div *ngIf="(error$ | async) === null" class="table-container">
    <!-- Initial loading state (no data yet) -->
    <div *ngIf="(loading$ | async) && (pagination$ | async) === null" class="loading-state" role="status" aria-live="polite">
      <mat-spinner diameter="50" aria-label="Loading tickets, please wait..."></mat-spinner>
      <p class="loading-text">Loading tickets...</p>
    </div>

    <!-- Tickets table — keep alive during reload so paginator state is preserved -->
    <ng-container *ngIf="(pagination$ | async) as pagination">
      <app-tickets-table
        [tickets]="(tickets$ | async) ?? []"
        [pagination]="pagination"
        [isLoading]="(loading$ | async) ?? false"
        [attemptedPageSize]="(attemptedPageSize$ | async)"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)"
        (createTicket)="openCreateDialog()"
        [dataTestId]="'tickets-table'"
      ></app-tickets-table>
    </ng-container>
  </div>
</div>
