<div class="app-shell">
  <aside class="sidebar" *ngIf="isAuthenticated">
    <div class="brand">
      <mat-icon aria-hidden="true">confirmation_number</mat-icon>
      <span>{{ title }}</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/tickets" routerLinkActive="active-link" class="nav-item">
        <mat-icon aria-hidden="true">list_alt</mat-icon>
        <span>Tickets</span>
      </a>

      <a
        *ngIf="isAdmin"
        routerLink="/admin/knowledge"
        routerLinkActive="active-link"
        class="nav-item"
        data-testid="nav-admin-knowledge"
      >
        <mat-icon aria-hidden="true">psychology</mat-icon>
        <span>Alimentar históricos (RAG)</span>
      </a>
    </nav>
  </aside>

  <div class="main-column">
    <header class="app-header" *ngIf="isAuthenticated">
      <span class="spacer"></span>

      <button
        mat-icon-button
        type="button"
        (click)="toggleTheme()"
        [attr.aria-label]="isDark(theme$ | async) ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [matTooltip]="isDark(theme$ | async) ? 'Modo claro' : 'Modo oscuro'"
      >
        <mat-icon>{{ isDark(theme$ | async) ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-trigger">
        <mat-icon aria-hidden="true">account_circle</mat-icon>
        <span class="username">{{ username }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon aria-hidden="true">logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    </header>

    <main class="app-main">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
