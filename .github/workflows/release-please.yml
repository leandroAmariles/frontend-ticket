name: release-please

# Repo con un solo paquete (release-type "simple"): el tag es simplemente
# vX.Y.Z, porque todo el repo ES frontend-ticket.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
